<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Pet Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181926;
      color: #cad3f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .game-card {
      background: #24273a;
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid #363a4f;
    }
    .badge {
      display: inline-block;
      background: #363a4f;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      color: #c6a0f6;
      margin-bottom: 8px;
    }
    .pet-avatar {
      font-size: 85px;
      margin: 10px 0 15px 0;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .pet-avatar:active {
      transform: scale(1.15) rotate(5deg);
    }
    .pet-name {
      font-size: 22px;
      font-weight: bold;
      color: #8aadf4;
      margin-bottom: 4px;
    }
    .stats-group {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      font-size: 13px;
    }
    .stat-header {
      display: flex;
      justify-content: space-between;
      color: #a5adcb;
    }
    .progress-track {
      background: #363a4f;
      border-radius: 10px;
      height: 10px;
      width: 100%;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .bar-hunger { background: #ed8796; }
    .bar-happy { background: #eed49f; }
    .bar-clean { background: #a6da95; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      background: #363a4f;
      color: #cad3f5;
      border: 1px solid #494d64;
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
      background: #494d64;
    }
    .btn-feed { color: #f5a97f; }
    .btn-play { color: #eed49f; }
    .btn-bath { color: #8bd5ca; }
    .btn-sleep { color: #b7bdf8; }

    .status-panel {
      margin-top: 20px;
      font-size: 12px;
      color: #8087a2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eed49f;
    }
    .status-dot.connected {
      background: #a6da95;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="badge" id="level-badge">Level 12</div>
    <div class="pet-avatar" id="avatar" onclick="tapPet()">🐘</div>
    <div class="pet-name" id="pet-name">Baby animal</div>

    <div class="stats-group">
      <div class="stat-row">
        <div class="stat-header">
          <span>🍗 အစာပြည့်မှု</span>
          <span id="txt-hunger">100%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar bar-hunger" id="bar-hunger" style="width: 100%;"></div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-header">
          <span>🎾 ပျော်ရွှင်မှု</span>
          <span id="txt-happy">100%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar bar-happy" id="bar-happy" style="width: 100%;"></div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat-header">
          <span>🧼 သန့်ရှင်းမှု</span>
          <span id="txt-clean">100%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar bar-clean" id="bar-clean" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <div class="actions-grid">
      <button class="btn-feed" onclick="feedPet()">🍗 အစာကျွေး</button>
      <button class="btn-play" onclick="playPet()">🎾 ကစားမည်</button>
      <button class="btn-bath" onclick="washPet()">🧼 ရေချိုးပေး</button>
      <button class="btn-sleep" onclick="evolvePet()">✨ Level တင်</button>
    </div>

    <div class="status-panel">
      <div class="status-dot" id="dot"></div>
      <span id="status-text">ဆာဗာသို့ ချိတ်ဆက်နေပါသည်...</span>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "soepaingthu.firebaseapp.com",
      databaseURL: "https://soepaingthu-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "soepaingthu",
      storageBucket: "soepaingthu.firebasestorage.app",
      messagingSenderId: "710224415576",
      appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const petRef = db.ref("shared_pet");

    const avatar = document.getElementById("avatar");
    const levelBadge = document.getElementById("level-badge");
    const txtHunger = document.getElementById("txt-hunger");
    const barHunger = document.getElementById("bar-hunger");
    const txtHappy = document.getElementById("txt-happy");
    const barHappy = document.getElementById("bar-happy");
    const txtClean = document.getElementById("txt-clean");
    const barClean = document.getElementById("bar-clean");
    const statusText = document.getElementById("status-text");
    const dot = document.getElementById("dot");

    let pet = {
      name: "Baby animal",
      level: 12,
      hunger: 100,
      happy: 100,
      clean: 100,
      avatar: "🐘"
    };

    petRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        pet = data;
        render();
        dot.classList.add("connected");
        statusText.innerText = "Realtime ချိတ်ဆက်ထားသည်";
      } else {
        petRef.set(pet);
      }
    });

    function render() {
      levelBadge.innerText = "Level " + (pet.level || 1);
      avatar.innerText = pet.avatar || "🐘";

      const h = Math.max(0, Math.min(100, pet.hunger || 0));
      const hp = Math.max(0, Math.min(100, pet.happy || 0));
      const c = Math.max(0, Math.min(100, pet.clean || 0));

      txtHunger.innerText = h + "%";
      barHunger.style.width = h + "%";

      txtHappy.innerText = hp + "%";
      barHappy.style.width = hp + "%";

      txtClean.innerText = c + "%";
      barClean.style.width = c + "%";
    }

    function animateAvatar(tempEmoji) {
      avatar.innerText = tempEmoji;
      setTimeout(() => {
        avatar.innerText = pet.avatar || "🐘";
      }, 700);
    }

    function feedPet() {
      const updatedHunger = Math.min(100, (pet.hunger || 0) + 15);
      petRef.update({ hunger: updatedHunger });
      animateAvatar("🍗");
    }

    function playPet() {
      const updatedHappy = Math.min(100, (pet.happy || 0) + 15);
      const updatedHunger = Math.max(0, (pet.hunger || 0) - 5);
      const updatedClean = Math.max(0, (pet.clean || 0) - 5);
      petRef.update({ 
        happy: updatedHappy, 
        hunger: updatedHunger, 
        clean: updatedClean 
      });
      animateAvatar("🎾");
    }

    function washPet() {
      const updatedClean = Math.min(100, (pet.clean || 0) + 20);
      petRef.update({ clean: updatedClean });
      animateAvatar("🧼");
    }

    function evolvePet() {
      const newLvl = (pet.level || 1) + 1;
      let newAvatar = "🐘";

      petRef.update({
        level: newLvl,
        avatar: newAvatar
      });
      animateAvatar("✨");
    }

    function tapPet() {
      animateAvatar("❤️");
    }
  </script>
</body>
</html>
